<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dhana Foods - Admin Dashboard</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #fff8f0;
            color: #4b2b1d;
        }

        header {
            background: linear-gradient(135deg, #8f2f0f, #c35419);
            color: white;
            text-align: center;
            padding: 35px 20px;
        }

        header h1 {
            margin: 0;
            font-size: 36px;
        }

        header p {
            margin: 10px 0 0;
            font-size: 18px;
        }

        .container {
            width: 92%;
            max-width: 1400px;
            margin: 30px auto;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 25px;
        }

        .top-bar h2 {
            margin: 0;
            color: #713014;
        }

        .refresh-button {
            border: none;
            background: #8f2f0f;
            color: white;
            padding: 14px 22px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .refresh-button:hover {
            background: #6f230c;
        }

        .summary-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .summary-card {
            background: white;
            border: 1px solid #efd6c3;
            border-radius: 18px;
            padding: 25px;
            text-align: center;
            box-shadow: 0 5px 20px rgba(80, 40, 10, 0.08);
        }

        .summary-icon {
            font-size: 38px;
        }

        .summary-number {
            font-size: 34px;
            font-weight: bold;
            color: #9a370d;
            margin: 8px 0;
        }

        .summary-label {
            font-size: 18px;
            color: #756960;
        }

        #loading {
            text-align: center;
            background: white;
            padding: 30px;
            border-radius: 15px;
            font-size: 18px;
        }

        #errorMessage {
            display: none;
            background: #ffe3e3;
            color: #a00000;
            border: 1px solid #efaaaa;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            text-align: center;
            font-size: 17px;
            font-weight: bold;
            white-space: pre-wrap;
        }

        .empty-orders {
            background: white;
            padding: 55px 20px;
            border-radius: 18px;
            text-align: center;
            box-shadow: 0 5px 20px rgba(80, 40, 10, 0.07);
        }

        .empty-orders .emoji {
            font-size: 55px;
        }

        .empty-orders h2 {
            color: #713014;
        }

        .empty-orders p {
            color: #756960;
        }

        .order-card {
            background: white;
            border: 1px solid #ead5c5;
            border-radius: 18px;
            margin-bottom: 25px;
            padding: 25px;
            box-shadow: 0 5px 20px rgba(80, 40, 10, 0.08);
        }

        .order-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            border-bottom: 1px solid #eee;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        .order-id {
            font-size: 22px;
            font-weight: bold;
            color: #8f2f0f;
        }

        .created-date {
            color: #777;
            font-size: 14px;
        }

        .customer-section {
            background: #fffaf5;
            border-radius: 12px;
            padding: 18px;
            margin-bottom: 20px;
        }

        .customer-section h3 {
            margin-top: 0;
            color: #713014;
        }

        .customer-info {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        .customer-info div {
            padding: 7px 0;
        }

        .address {
            grid-column: 1 / -1;
        }

        .products-title {
            color: #713014;
            margin-bottom: 10px;
        }

        .products-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
        }

        .products-table th,
        .products-table td {
            border: 1px solid #eadbd0;
            padding: 12px;
            text-align: left;
        }

        .products-table th {
            background: #fff0e4;
            color: #713014;
        }

        .products-table td:last-child,
        .products-table th:last-child {
            text-align: right;
        }

        .order-total {
            display: flex;
            justify-content: flex-end;
            font-size: 24px;
            font-weight: bold;
            color: #8f2f0f;
            margin: 15px 0 20px;
        }

        .delivery-date {
            background: #f8f3ed;
            padding: 13px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .status-section {
            display: flex;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .status-section label {
            font-weight: bold;
        }

        .status-select {
            padding: 12px 15px;
            border-radius: 9px;
            border: 1px solid #d9bba8;
            font-size: 16px;
            background: white;
            cursor: pointer;
        }

        .status-badge {
            padding: 10px 15px;
            border-radius: 20px;
            font-weight: bold;
            background: #fff0cf;
        }

        .delete-button {
            margin-left: auto;
            border: none;
            background: #b42318;
            color: white;
            padding: 11px 18px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }

        .delete-button:hover {
            background: #8c170f;
        }

        .success-message {
            display: none;
            background: #e1f7e7;
            color: #176b2c;
            padding: 12px;
            border-radius: 8px;
            margin-top: 10px;
        }

        @media (max-width: 750px) {

            header h1 {
                font-size: 27px;
            }

            .container {
                width: 94%;
            }

            .top-bar {
                flex-direction: column;
                align-items: stretch;
            }

            .top-bar h2 {
                text-align: center;
            }

            .refresh-button {
                width: 100%;
            }

            .summary-grid {
                grid-template-columns: 1fr;
            }

            .customer-info {
                grid-template-columns: 1fr;
            }

            .address {
                grid-column: auto;
            }

            .products-table {
                display: block;
                overflow-x: auto;
            }

            .order-header {
                flex-direction: column;
                align-items: flex-start;
            }

            .status-section {
                flex-direction: column;
                align-items: stretch;
            }

            .status-select {
                width: 100%;
            }

            .delete-button {
                width: 100%;
                margin-left: 0;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>🥣 Dhana Foods Admin Dashboard</h1>
    <p>Customer Orders Management</p>
</header>

<div class="container">

    <div class="top-bar">
        <h2>📋 Customer Orders</h2>

        <button
            type="button"
            class="refresh-button"
            onclick="loadOrders()"
        >
            🔄 Refresh Orders
        </button>
    </div>

    <div class="summary-grid">

        <div class="summary-card">
            <div class="summary-icon">📦</div>
            <div id="totalOrders" class="summary-number">0</div>
            <div class="summary-label">Total Orders</div>
        </div>

        <div class="summary-card">
            <div class="summary-icon">⏳</div>
            <div id="pendingOrders" class="summary-number">0</div>
            <div class="summary-label">Pending Orders</div>
        </div>

        <div class="summary-card">
            <div class="summary-icon">💰</div>
            <div id="totalSales" class="summary-number">₹0</div>
            <div class="summary-label">Total Sales</div>
        </div>

    </div>

    <div id="errorMessage"></div>

    <div id="loading">
        ⏳ Loading orders...
    </div>

    <div id="ordersContainer"></div>

</div>

<script>

    /* =====================================================
       SAFE HTML
    ===================================================== */

    function escapeHTML(value) {

        if (value === null || value === undefined) {
            return "";
        }

        return String(value)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }


    /* =====================================================
       FORMAT MONEY
    ===================================================== */

    function formatMoney(value) {

        const number = Number(value) || 0;

        return "₹" + number.toFixed(2);
    }


    /* =====================================================
       FORMAT DATE
    ===================================================== */

    function formatDate(value) {

        if (!value) {
            return "-";
        }

        try {

            const date = new Date(value);

            if (isNaN(date.getTime())) {
                return escapeHTML(value);
            }

            return date.toLocaleString("en-IN");

        } catch (error) {

            return escapeHTML(value);

        }
    }


    /* =====================================================
       PARSE ITEMS
    ===================================================== */

    function getItems(order) {

        let items = order.items;

        if (!items) {
            return [];
        }

        if (typeof items === "string") {

            try {
                items = JSON.parse(items);
            } catch (error) {
                return [];
            }

        }

        return Array.isArray(items) ? items : [];
    }


    /* =====================================================
       UPDATE SUMMARY
    ===================================================== */

    function updateSummary(orders) {

        const totalOrders = orders.length;

        const pendingOrders = orders.filter(
            order =>
                String(order.status || "Pending").toLowerCase()
                === "pending"
        ).length;

        const totalSales = orders.reduce(
            (sum, order) =>
                sum + (Number(order.total) || 0),
            0
        );

        document.getElementById("totalOrders").textContent =
            totalOrders;

        document.getElementById("pendingOrders").textContent =
            pendingOrders;

        document.getElementById("totalSales").textContent =
            formatMoney(totalSales);
    }


    /* =====================================================
       STATUS COLOR
    ===================================================== */

    function getStatusEmoji(status) {

        switch (status) {

            case "Pending":
                return "🟡";

            case "Preparing":
                return "🔵";

            case "Out for Delivery":
                return "🟠";

            case "Delivered":
                return "🟢";

            case "Cancelled":
                return "🔴";

            default:
                return "⚪";
        }
    }


    /* =====================================================
       CREATE ORDER CARD
    ===================================================== */

    function createOrderCard(order) {

        const card = document.createElement("div");

        card.className = "order-card";

        const items = getItems(order);

        const status =
            order.status || "Pending";

        let productsHTML = "";

        if (items.length === 0) {

            productsHTML = `
                <tr>
                    <td colspan="5">
                        No product details available.
                    </td>
                </tr>
            `;

        } else {

            productsHTML = items.map(item => {

                const product =
                    item.product ||
                    item.name ||
                    "-";

                const size =
                    item.size ||
                    "-";

                const quantity =
                    Number(item.quantity) || 0;

                const price =
                    Number(item.price) || 0;

                const itemTotal =
                    Number(item.itemTotal) ||
                    quantity * price;

                return `
                    <tr>

                        <td>
                            ${escapeHTML(product)}
                        </td>

                        <td>
                            ${escapeHTML(size)}
                        </td>

                        <td>
                            ${quantity}
                        </td>

                        <td>
                            ${formatMoney(price)}
                        </td>

                        <td>
                            ${formatMoney(itemTotal)}
                        </td>

                    </tr>
                `;

            }).join("");

        }


        card.innerHTML = `

            <div class="order-header">

                <div>
                    <div class="order-id">
                        🧾 Order #${escapeHTML(order.id)}
                    </div>

                    <div class="created-date">
                        ${formatDate(order.created_at)}
                    </div>
                </div>

                <div class="status-badge">
                    ${getStatusEmoji(status)}
                    ${escapeHTML(status)}
                </div>

            </div>


            <div class="customer-section">

                <h3>👤 Customer Details</h3>

                <div class="customer-info">

                    <div>
                        <strong>Name:</strong><br>
                        ${escapeHTML(order.customer_name || "-")}
                    </div>

                    <div>
                        <strong>Phone:</strong><br>
                        ${escapeHTML(order.phone || "-")}
                    </div>

                    <div class="address">
                        <strong>Address:</strong><br>
                        ${escapeHTML(order.address || "-")}
                    </div>

                </div>

            </div>


            <h3 class="products-title">
                🛒 Ordered Products
            </h3>


            <table class="products-table">

                <thead>
                    <tr>
                        <th>Product</th>
                        <th>Size</th>
                        <th>Qty</th>
                        <th>Price</th>
                        <th>Total</th>
                    </tr>
                </thead>

                <tbody>
                    ${productsHTML}
                </tbody>

            </table>


            <div class="order-total">
                Total: ${formatMoney(order.total)}
            </div>


            <div class="delivery-date">
                📅 <strong>Delivery Date:</strong>
                ${escapeHTML(order.delivery_date || "-")}
            </div>


            <div class="status-section">

                <label>
                    Update Status:
                </label>

                <select
                    class="status-select"
                    data-order-id="${escapeHTML(order.id)}"
                >

                    <option value="Pending"
                        ${status === "Pending" ? "selected" : ""}>
                        🟡 Pending
                    </option>

                    <option value="Preparing"
                        ${status === "Preparing" ? "selected" : ""}>
                        🔵 Preparing
                    </option>

                    <option value="Out for Delivery"
                        ${status === "Out for Delivery" ? "selected" : ""}>
                        🟠 Out for Delivery
                    </option>

                    <option value="Delivered"
                        ${status === "Delivered" ? "selected" : ""}>
                        🟢 Delivered
                    </option>

                    <option value="Cancelled"
                        ${status === "Cancelled" ? "selected" : ""}>
                        🔴 Cancelled
                    </option>

                </select>


                <button
                    type="button"
                    class="delete-button"
                    data-delete-id="${escapeHTML(order.id)}"
                >
                    🗑️ Delete Order
                </button>

            </div>


            <div
                class="success-message"
                id="success-${escapeHTML(order.id)}"
            >
                ✅ Order updated successfully.
            </div>

        `;


        const select =
            card.querySelector(".status-select");

        select.addEventListener(
            "change",
            function () {

                updateOrderStatus(
                    order.id,
                    this.value,
                    card
                );

            }
        );


        const deleteButton =
            card.querySelector(".delete-button");

        deleteButton.addEventListener(
            "click",
            function () {

                deleteOrder(
                    order.id,
                    card
                );

            }
        );


        return card;
    }


    /* =====================================================
       UPDATE STATUS
    ===================================================== */

    async function updateOrderStatus(
        orderId,
        status,
        card
    ) {

        try {

            const response =
                await fetch(
                    `/api/orders/${encodeURIComponent(orderId)}`,
                    {
                        method: "PUT",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({
                            status: status
                        })
                    }
                );


            const data =
                await response.json();


            if (!response.ok || data.success === false) {

                throw new Error(
                    data.message ||
                    "Unable to update order."
                );

            }


            const success =
                card.querySelector(".success-message");

            if (success) {

                success.style.display =
                    "block";

                setTimeout(() => {
                    success.style.display =
                        "none";
                }, 2500);

            }


            loadOrders();

        } catch (error) {

            alert(
                "Unable to update order:\n" +
                error.message
            );

        }

    }


    /* =====================================================
       DELETE ORDER
    ===================================================== */

    async function deleteOrder(
        orderId,
        card
    ) {

        const confirmed =
            confirm(
                "Are you sure you want to delete Order #" +
                orderId +
                "?"
            );

        if (!confirmed) {
            return;
        }


        try {

            const response =
                await fetch(
                    `/api/orders/${encodeURIComponent(orderId)}`,
                    {
                        method: "DELETE"
                    }
                );


            const data =
                await response.json();


            if (!response.ok || data.success === false) {

                throw new Error(
                    data.message ||
                    "Unable to delete order."
                );

            }


            card.remove();

            loadOrders();

        } catch (error) {

            alert(
                "Unable to delete order:\n" +
                error.message
            );

        }

    }


    /* =====================================================
       EMPTY ORDERS
    ===================================================== */

    function showEmptyOrders() {

        const container =
            document.getElementById(
                "ordersContainer"
            );

        container.innerHTML = `

            <div class="empty-orders">

                <div class="emoji">
                    📦
                </div>

                <h2>
                    No Orders Yet
                </h2>

                <p>
                    Customer orders will appear here
                    after they place an order.
                </p>

            </div>

        `;

    }


    /* =====================================================
       LOAD ORDERS
    ===================================================== */

    async function loadOrders() {

        const loading =
            document.getElementById(
                "loading"
            );

        const container =
            document.getElementById(
                "ordersContainer"
            );

        const errorMessage =
            document.getElementById(
                "errorMessage"
            );


        loading.style.display =
            "block";

        errorMessage.style.display =
            "none";

        container.innerHTML =
            "";


        try {

            const response =
                await fetch(
                    "/api/orders",
                    {
                        method: "GET",

                        headers: {
                            "Accept": "application/json"
                        },

                        cache: "no-store"
                    }
                );


            const rawText =
                await response.text();


            let data;

            try {

                data =
                    JSON.parse(rawText);

            } catch (jsonError) {

                throw new Error(
                    "Server returned invalid JSON.\n\n" +
                    rawText.substring(0, 500)
                );

            }


            if (!response.ok) {

                throw new Error(
                    data.message ||
                    data.error ||
                    "Server error: HTTP " +
                    response.status
                );

            }


            /*
                ACCEPT BOTH:

                1. [ orders ]

                2. {
                       success: true,
                       orders: [ orders ]
                   }
            */

            let orders = null;


            if (Array.isArray(data)) {

                orders = data;

            } else if (
                data &&
                Array.isArray(data.orders)
            ) {

                orders = data.orders;

            } else if (
                data &&
                Array.isArray(data.data)
            ) {

                orders = data.data;

            }


            if (!orders) {

                throw new Error(
                    "The server response is not an orders list.\n\n" +
                    JSON.stringify(data, null, 2)
                );

            }


            updateSummary(orders);


            loading.style.display =
                "none";


            if (orders.length === 0) {

                showEmptyOrders();

                return;

            }


            orders.forEach(
                order => {

                    const card =
                        createOrderCard(order);

                    container.appendChild(card);

                }
            );


        } catch (error) {

            console.error(
                "Load orders error:",
                error
            );


            loading.style.display =
                "none";


            errorMessage.textContent =
                "❌ Unable to load orders.\n\n" +
                error.message;


            errorMessage.style.display =
                "block";

        }

    }


    /* =====================================================
       START
    ===================================================== */

    loadOrders();

</script>

</body>
</html>
