<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Dhana Foods Admin Dashboard</title>


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        body {
            font-family: Arial, Helvetica, sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #fff8ef,
                    #fffdf9
                );

            color: #33261f;

            min-height: 100vh;
        }


        /* =================================================
           HEADER
        ================================================= */

        header {
            background:
                linear-gradient(
                    135deg,
                    #6f2e12,
                    #a94b1c
                );

            color: white;

            padding: 25px 20px;

            text-align: center;

            box-shadow:
                0 5px 20px
                rgba(70, 30, 10, 0.18);
        }


        header h1 {
            font-size: 32px;

            margin-bottom: 5px;
        }


        header p {
            opacity: 0.92;

            font-size: 15px;
        }


        /* =================================================
           MAIN
        ================================================= */

        .container {
            width: 94%;

            max-width: 1200px;

            margin: 30px auto;
        }


        /* =================================================
           TOP BAR
        ================================================= */

        .top-bar {
            display: flex;

            justify-content: space-between;

            align-items: center;

            gap: 15px;

            margin-bottom: 25px;
        }


        .top-bar h2 {
            color: #713014;

            font-size: 28px;
        }


        .refresh-button {
            border: none;

            background: #7e3515;

            color: white;

            padding: 12px 20px;

            border-radius: 10px;

            font-size: 15px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.2s;
        }


        .refresh-button:hover {
            background: #a94b1c;

            transform: translateY(-1px);
        }


        /* =================================================
           SUMMARY
        ================================================= */

        .summary-grid {
            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 18px;

            margin-bottom: 30px;
        }


        .summary-card {
            background: white;

            border: 1px solid #ead7c1;

            border-radius: 17px;

            padding: 22px;

            text-align: center;

            box-shadow:
                0 6px 22px
                rgba(80, 40, 10, 0.07);
        }


        .summary-icon {
            font-size: 30px;

            margin-bottom: 5px;
        }


        .summary-number {
            font-size: 30px;

            font-weight: bold;

            color: #843815;
        }


        .summary-label {
            color: #74665d;

            margin-top: 3px;
        }


        /* =================================================
           LOADING
        ================================================= */

        #loading {
            background: white;

            border-radius: 16px;

            padding: 35px;

            text-align: center;

            color: #7e3515;

            font-weight: bold;

            box-shadow:
                0 6px 22px
                rgba(80, 40, 10, 0.07);
        }


        /* =================================================
           ERROR
        ================================================= */

        #errorMessage {
            display: none;

            background: #ffe4e4;

            border: 1px solid #e1aaaa;

            color: #a00000;

            padding: 17px;

            border-radius: 12px;

            margin-bottom: 20px;

            text-align: center;

            font-weight: bold;
        }


        /* =================================================
           ORDER CARD
        ================================================= */

        .order-card {
            background: white;

            border: 1px solid #ead7c1;

            border-radius: 20px;

            padding: 25px;

            margin-bottom: 25px;

            box-shadow:
                0 7px 25px
                rgba(80, 40, 10, 0.08);
        }


        /* =================================================
           ORDER HEADER
        ================================================= */

        .order-header {
            display: flex;

            justify-content: space-between;

            align-items: center;

            gap: 15px;

            padding-bottom: 17px;

            border-bottom:
                1px solid #eaded4;
        }


        .order-number {
            font-size: 23px;

            font-weight: bold;

            color: #713014;
        }


        .order-created {
            color: #756960;

            font-size: 14px;
        }


        /* =================================================
           CUSTOMER
        ================================================= */

        .customer-box {
            background: #fff8ed;

            border: 1px solid #f0dfc8;

            border-radius: 14px;

            padding: 18px;

            margin-top: 20px;
        }


        .customer-row {
            margin: 8px 0;

            font-size: 16px;

            line-height: 1.5;
        }


        .customer-row strong {
            color: #513426;
        }


        /* =================================================
           PRODUCTS
        ================================================= */

        .products-title {
            color: #713014;

            font-size: 21px;

            font-weight: bold;

            margin-top: 25px;

            margin-bottom: 12px;
        }


        .table-container {
            width: 100%;

            overflow-x: auto;

            border:
                1px solid #eaded4;

            border-radius: 12px;
        }


        .products-table {
            width: 100%;

            min-width: 650px;

            border-collapse: collapse;
        }


        .products-table th {
            background: #f7efe6;

            color: #4e392c;

            padding: 13px;

            text-align: left;

            font-size: 14px;
        }


        .products-table td {
            padding: 13px;

            border-top:
                1px solid #eee1d6;

            font-size: 15px;
        }


        .products-table tr:hover td {
            background: #fffaf5;
        }


        .product-name {
            font-weight: bold;

            color: #733315;
        }


        .quantity {
            font-weight: bold;

            text-align: center;
        }


        .unit-price {
            color: #66574e;
        }


        .item-total {
            font-weight: bold;

            color: #9b431c;
        }


        /* =================================================
           TOTAL
        ================================================= */

        .order-total {
            display: flex;

            justify-content: flex-end;

            align-items: center;

            gap: 10px;

            margin-top: 18px;

            padding-top: 17px;

            border-top:
                2px solid #e6cdb2;

            font-size: 25px;

            font-weight: bold;

            color: #713014;
        }


        .order-total-value {
            color: #a9481c;
        }


        /* =================================================
           DELIVERY
        ================================================= */

        .delivery-box {
            background: #f5f8f1;

            border:
                1px solid #d9e4cf;

            border-radius: 12px;

            padding: 15px;

            margin-top: 18px;

            color: #315a35;

            font-size: 16px;
        }


        /* =================================================
           STATUS
        ================================================= */

        .status-section {
            display: flex;

            align-items: center;

            flex-wrap: wrap;

            gap: 12px;

            margin-top: 20px;
        }


        .status-section label {
            font-weight: bold;

            color: #513426;
        }


        .status-select {
            padding: 11px 14px;

            border:
                1px solid #d6c0aa;

            border-radius: 9px;

            background: white;

            color: #33261f;

            font-size: 15px;

            font-weight: bold;

            cursor: pointer;

            outline: none;
        }


        .status-select:focus {
            border-color: #a9481c;

            box-shadow:
                0 0 0 3px
                rgba(169, 72, 28, 0.10);
        }


        .status-badge {
            display: inline-flex;

            align-items: center;

            justify-content: center;

            gap: 5px;

            padding: 9px 15px;

            border-radius: 30px;

            font-weight: bold;

            font-size: 14px;
        }


        .pending {
            background: #fff0bd;

            color: #806000;
        }


        .preparing {
            background: #dcecff;

            color: #07558a;
        }


        .out-delivery {
            background: #ffe3c2;

            color: #9a4d00;
        }


        .delivered {
            background: #d9f5dd;

            color: #18702d;
        }


        .cancelled {
            background: #ffdede;

            color: #a00000;
        }


        /* =================================================
           DELETE
        ================================================= */

        .delete-button {
            margin-top: 18px;

            border: none;

            background: #df3434;

            color: white;

            padding: 12px 18px;

            border-radius: 9px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.2s;
        }


        .delete-button:hover {
            background: #bd2525;

            transform: translateY(-1px);
        }


        /* =================================================
           EMPTY
        ================================================= */

        .empty-orders {
            background: white;

            border: 1px solid #ead7c1;

            border-radius: 18px;

            padding: 50px 20px;

            text-align: center;

            box-shadow:
                0 6px 22px
                rgba(80, 40, 10, 0.07);
        }


        .empty-orders .emoji {
            font-size: 50px;

            margin-bottom: 10px;
        }


        .empty-orders h2 {
            color: #713014;

            margin-bottom: 5px;
        }


        .empty-orders p {
            color: #756960;
        }


        /* =================================================
           MOBILE
        ================================================= */

        @media (max-width: 750px) {

            header h1 {
                font-size: 27px;
            }


            .container {
                width: 94%;
            }


            .top-bar {
                flex-direction: column;

                align-items: stretch;
            }


            .top-bar h2 {
                text-align: center;
            }


            .refresh-button {
                width: 100%;
            }


            .summary-grid {
                grid-template-columns: 1fr;
            }


            .order-card {
                padding: 17px;
            }


            .order-header {
                flex-direction: column;

                align-items: flex-start;
            }


            .order-total {
                justify-content: space-between;

                font-size: 21px;
            }


            .status-section {
                flex-direction: column;

                align-items: stretch;
            }


            .status-select {
                width: 100%;
            }


            .status-badge {
                width: 100%;
            }


            .delete-button {
                width: 100%;
            }

        }

    </style>

</head>


<body>


<!-- =====================================================
     HEADER
===================================================== -->

<header>

    <h1>
        🥣 Dhana Foods Admin Dashboard
    </h1>

    <p>
        Customer Orders Management
    </p>

</header>



<div class="container">


    <!-- =================================================
         TOP BAR
    ================================================= -->

    <div class="top-bar">

        <h2>
            📋 Customer Orders
        </h2>


        <button
            type="button"
            class="refresh-button"
            onclick="loadOrders()"
        >
            🔄 Refresh Orders
        </button>

    </div>



    <!-- =================================================
         SUMMARY
    ================================================= -->

    <div class="summary-grid">


        <div class="summary-card">

            <div class="summary-icon">
                📦
            </div>

            <div
                id="totalOrders"
                class="summary-number"
            >
                0
            </div>

            <div class="summary-label">
                Total Orders
            </div>

        </div>



        <div class="summary-card">

            <div class="summary-icon">
                ⏳
            </div>

            <div
                id="pendingOrders"
                class="summary-number"
            >
                0
            </div>

            <div class="summary-label">
                Pending Orders
            </div>

        </div>



        <div class="summary-card">

            <div class="summary-icon">
                💰
            </div>

            <div
                id="totalSales"
                class="summary-number"
            >
                ₹0
            </div>

            <div class="summary-label">
                Total Sales
            </div>

        </div>

    </div>



    <!-- =================================================
         ERROR
    ================================================= -->

    <div
        id="errorMessage"
    ></div>



    <!-- =================================================
         LOADING
    ================================================= -->

    <div id="loading">

        ⏳ Loading orders...

    </div>



    <!-- =================================================
         ORDERS
    ================================================= -->

    <div
        id="ordersContainer"
    ></div>


</div>



<script>


/* =====================================================
   LOAD ORDERS
===================================================== */

async function loadOrders() {

    const loading =
        document.getElementById(
            "loading"
        );


    const container =
        document.getElementById(
            "ordersContainer"
        );


    const errorMessage =
        document.getElementById(
            "errorMessage"
        );


    loading.style.display =
        "block";


    errorMessage.style.display =
        "none";


    container.innerHTML =
        "";


    try {


        const response =
            await fetch(
                "/api/orders"
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.message ||
                "Unable to load orders."
            );

        }


        if (
            !Array.isArray(data)
        ) {

            throw new Error(
                "Invalid orders response."
            );

        }


        updateSummary(data);


        loading.style.display =
            "none";


        if (
            data.length === 0
        ) {

            showEmptyOrders();

            return;

        }


        data.forEach(
            order => {

                const card =
                    createOrderCard(
                        order
                    );


                container.appendChild(
                    card
                );

            }
        );


    } catch (error) {

        console.error(
            "Load orders error:",
            error
        );


        loading.style.display =
            "none";


        errorMessage.textContent =
            "❌ " +
            (
                error.message ||
                "Unable to load orders."
            );


        errorMessage.style.display =
            "block";

    }

}


/* =====================================================
   CREATE ORDER CARD
===================================================== */

function createOrderCard(
    order
) {

    const card =
        document.createElement(
            "div"
        );


    card.className =
        "order-card";


    const items =
        getOrderItems(
            order
        );


    let productsHTML =
        "";


    if (
        items.length === 0
    ) {

        productsHTML = `

            <tr>

                <td colspan="5">

                    No product details found.

                </td>

            </tr>

        `;

    } else {


        items.forEach(
            item => {

                const product =
                    escapeHTML(
                        item.product ||
                        "Unknown Product"
                    );


                const size =
                    escapeHTML(
                        item.size ||
                        "-"
                    );


                const quantity =
                    Number(
                        item.quantity
                    ) || 0;


                const price =
                    Number(
                        item.price
                    ) || 0;


                const itemTotal =
                    quantity * price;


                productsHTML += `

                    <tr>

                        <td class="product-name">

                            ${product}

                        </td>


                        <td>

                            ${size}

                        </td>


                        <td class="quantity">

                            ${quantity}

                        </td>


                        <td class="unit-price">

                            ₹${price}

                        </td>


                        <td class="item-total">

                            ₹${itemTotal}

                        </td>

                    </tr>

                `;

            }
        );

    }


    const total =
        Number(
            order.total
        ) || calculateItemsTotal(
            items
        );


    const status =
        order.status ||
        "Pending";


    const createdAt =
        formatDateTime(
            order.created_at
        );


    const deliveryDate =
        escapeHTML(
            order.delivery_date ||
            "-"
        );


    const customerName =
        escapeHTML(
            order.customer_name ||
            ""
        );


    const phone =
        escapeHTML(
            order.phone ||
            ""
        );


    const address =
        escapeHTML(
            order.address ||
            ""
        );


    card.innerHTML = `

        <!-- ORDER HEADER -->

        <div class="order-header">

            <div class="order-number">

                🧾 Order #${order.id}

            </div>


            <div class="order-created">

                ${createdAt}

            </div>

        </div>



        <!-- CUSTOMER -->

        <div class="customer-box">


            <div class="customer-row">

                👤

                <strong>
                    Customer:
                </strong>

                ${customerName}

            </div>


            <div class="customer-row">

                📞

                <strong>
                    Phone:
                </strong>

                ${phone}

            </div>


            <div class="customer-row">

                📍

                <strong>
                    Address:
                </strong>

                ${address}

            </div>


        </div>



        <!-- PRODUCTS -->

        <div class="products-title">

            📦 Ordered Products

        </div>


        <div class="table-container">

            <table class="products-table">


                <thead>

                    <tr>

                        <th>
                            Product
                        </th>

                        <th>
                            Size
                        </th>

                        <th>
                            Qty
                        </th>

                        <th>
                            Unit Price
                        </th>

                        <th>
                            Item Total
                        </th>

                    </tr>

                </thead>


                <tbody>

                    ${productsHTML}

                </tbody>


            </table>

        </div>



        <!-- TOTAL -->

        <div class="order-total">

            <span>
                Order Total:
            </span>

            <span class="order-total-value">

                ₹${total}

            </span>

        </div>



        <!-- DELIVERY -->

        <div class="delivery-box">

            📅

            <strong>
                Delivery Date:
            </strong>

            ${deliveryDate}

        </div>



        <!-- STATUS -->

        <div class="status-section">

            <label>
                Order Status:
            </label>


            <select
                class="status-select"
                onchange="
                    updateStatus(
                        ${Number(order.id)},
                        this.value
                    )
                "
            >

                <option
                    value="Pending"
                    ${status === "Pending"
                        ? "selected"
                        : ""}
                >
                    🟡 Pending
                </option>


                <option
                    value="Preparing"
                    ${status === "Preparing"
                        ? "selected"
                        : ""}
                >
                    🔵 Preparing
                </option>


                <option
                    value="Out for Delivery"
                    ${status === "Out for Delivery"
                        ? "selected"
                        : ""}
                >
                    🟠 Out for Delivery
                </option>


                <option
                    value="Delivered"
                    ${status === "Delivered"
                        ? "selected"
                        : ""}
                >
                    🟢 Delivered
                </option>


                <option
                    value="Cancelled"
                    ${status === "Cancelled"
                        ? "selected"
                        : ""}
                >
                    🔴 Cancelled
                </option>

            </select>


            <span
                class="
                    status-badge
                    ${getStatusClass(status)}
                "
            >

                ${getStatusEmoji(status)}

                ${escapeHTML(status)}

            </span>


        </div>



        <!-- DELETE -->

        <button
            type="button"
            class="delete-button"
            onclick="
                deleteOrder(
                    ${Number(order.id)}
                )
            "
        >

            🗑️ Delete Order

        </button>

    `;


    return card;

}


/* =====================================================
   GET ORDER ITEMS
===================================================== */

function getOrderItems(
    order
) {

    let items =
        order.items;


    if (
        typeof items === "string"
    ) {

        try {

            items =
                JSON.parse(
                    items
                );

        } catch (error) {

            console.error(
                "Unable to parse order items:",
                error
            );

            items = [];

        }

    }


    if (
        !Array.isArray(items)
    ) {

        /*
           Compatibility with very old
           orders.
        */

        if (
            order.product
        ) {

            return [

                {

                    product:
                        order.product,

                    size:
                        order.size,

                    quantity:
                        Number(
                            order.quantity
                        ) || 1,

                    price:
                        Number(
                            order.price
                        ) || 0

                }

            ];

        }


        return [];

    }


    return items;

}


/* =====================================================
   CALCULATE ITEMS TOTAL
===================================================== */

function calculateItemsTotal(
    items
) {

    return items.reduce(
        (
            total,
            item
        ) => {

            const quantity =
                Number(
                    item.quantity
                ) || 0;


            const price =
                Number(
                    item.price
                ) || 0;


            return total +
                (
                    quantity *
                    price
                );

        },
        0
    );

}


/* =====================================================
   UPDATE SUMMARY
===================================================== */

function updateSummary(
    orders
) {

    const totalOrders =
        orders.length;


    const pendingOrders =
        orders.filter(
            order =>
                order.status ===
                "Pending"
        ).length;


    const totalSales =
        orders.reduce(
            (
                total,
                order
            ) => {

                return total +
                    (
                        Number(
                            order.total
                        ) || 0
                    );

            },
            0
        );


    document.getElementById(
        "totalOrders"
    ).textContent =
        totalOrders;


    document.getElementById(
        "pendingOrders"
    ).textContent =
        pendingOrders;


    document.getElementById(
        "totalSales"
    ).textContent =
        `₹${totalSales}`;

}


/* =====================================================
   UPDATE STATUS
===================================================== */

async function updateStatus(
    orderId,
    newStatus
) {

    try {

        const response =
            await fetch(
                `/api/orders/${orderId}`,
                {

                    method: "PUT",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body:
                        JSON.stringify({

                            status:
                                newStatus

                        })

                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.message ||
                "Unable to update status."
            );

        }


        await loadOrders();


    } catch (error) {

        console.error(
            "Status update error:",
            error
        );


        alert(
            error.message ||
            "Unable to update status."
        );


        await loadOrders();

    }

}


/* =====================================================
   DELETE ORDER
===================================================== */

async function deleteOrder(
    orderId
) {

    const confirmed =
        confirm(
            `Are you sure you want to delete Order #${orderId}?`
        );


    if (!confirmed) {

        return;

    }


    try {

        const response =
            await fetch(
                `/api/orders/${orderId}`,
                {
                    method: "DELETE"
                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.message ||
                "Unable to delete order."
            );

        }


        await loadOrders();


    } catch (error) {

        console.error(
            "Delete order error:",
            error
        );


        alert(
            error.message ||
            "Unable to delete order."
        );

    }

}


/* =====================================================
   STATUS CLASS
===================================================== */

function getStatusClass(
    status
) {

    switch (status) {

        case "Preparing":
            return "preparing";

        case "Out for Delivery":
            return "out-delivery";

        case "Delivered":
            return "delivered";

        case "Cancelled":
            return "cancelled";

        default:
            return "pending";

    }

}


/* =====================================================
   STATUS EMOJI
===================================================== */

function getStatusEmoji(
    status
) {

    switch (status) {

        case "Preparing":
            return "🔵";

        case "Out for Delivery":
            return "🟠";

        case "Delivered":
            return "🟢";

        case "Cancelled":
            return "🔴";

        default:
            return "🟡";

    }

}


/* =====================================================
   DATE FORMAT
===================================================== */

function formatDateTime(
    value
) {

    if (!value) {

        return "-";

    }


    const date =
        new Date(value);


    if (
        Number.isNaN(
            date.getTime()
        )
    ) {

        return escapeHTML(
            String(value)
        );

    }


    return date.toLocaleString(
        "en-IN",
        {

            day: "numeric",

            month: "short",

            year: "numeric",

            hour: "numeric",

            minute: "2-digit"

        }
    );

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(
    value
) {

    return String(value)
        .replace(
            /&/g,
            "&amp;"
        )
