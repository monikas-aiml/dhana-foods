<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>DHANA FOODS - Admin</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f7f2;
      color: #222;
      min-height: 100vh;
    }

    header {
      background: #174d2c;
      color: white;
      padding: 22px 20px;
      text-align: center;
      box-shadow: 0 3px 12px rgba(0,0,0,0.15);
    }

    header h1 {
      font-size: 30px;
      margin-bottom: 6px;
    }

    header p {
      font-size: 14px;
      opacity: 0.9;
    }

    .container {
      width: 95%;
      max-width: 1200px;
      margin: 25px auto 50px;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }

    .top-bar h2 {
      color: #174d2c;
      font-size: 24px;
    }

    .refresh-btn {
      border: none;
      background: #174d2c;
      color: white;
      padding: 11px 18px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      font-size: 14px;
    }

    .refresh-btn:hover {
      background: #0e3b20;
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 15px;
      margin-bottom: 25px;
    }

    .summary-card {
      background: white;
      border-radius: 12px;
      padding: 18px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
      text-align: center;
    }

    .summary-card .number {
      display: block;
      font-size: 28px;
      font-weight: bold;
      color: #174d2c;
      margin-bottom: 5px;
    }

    .summary-card .label {
      font-size: 13px;
      color: #666;
    }

    #ordersContainer {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .order-card {
      background: white;
      border-radius: 14px;
      padding: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.09);
      border-left: 6px solid #f2b705;
    }

    .order-card.preparing {
      border-left-color: #2196f3;
    }

    .order-card.out-for-delivery {
      border-left-color: #ff9800;
    }

    .order-card.delivered {
      border-left-color: #2e9d4d;
    }

    .order-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      flex-wrap: wrap;
      margin-bottom: 15px;
      padding-bottom: 12px;
      border-bottom: 1px solid #eee;
    }

    .order-id {
      font-size: 20px;
      font-weight: bold;
      color: #174d2c;
    }

    .order-date {
      color: #777;
      font-size: 13px;
    }

    .customer-section {
      background: #f8faf7;
      border-radius: 10px;
      padding: 15px;
      margin-bottom: 15px;
    }

    .customer-section h3 {
      color: #174d2c;
      font-size: 16px;
      margin-bottom: 10px;
    }

    .customer-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px 20px;
    }

    .customer-row {
      font-size: 14px;
      line-height: 1.5;
    }

    .customer-row strong {
      color: #444;
    }

    .items-section {
      margin-bottom: 15px;
    }

    .items-section h3 {
      color: #174d2c;
      font-size: 16px;
      margin-bottom: 10px;
    }

    .items-table {
      width: 100%;
      border-collapse: collapse;
      overflow: hidden;
      border-radius: 8px;
    }

    .items-table th {
      background: #174d2c;
      color: white;
      padding: 10px;
      font-size: 13px;
      text-align: left;
    }

    .items-table td {
      padding: 10px;
      border-bottom: 1px solid #eee;
      font-size: 14px;
    }

    .items-table tr:last-child td {
      border-bottom: none;
    }

    .order-bottom {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      flex-wrap: wrap;
      padding-top: 15px;
      border-top: 1px solid #eee;
    }

    .total {
      font-size: 21px;
      font-weight: bold;
      color: #174d2c;
    }

    .delivery-date {
      font-size: 14px;
      color: #555;
    }

    .actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .status-select {
      padding: 9px 12px;
      border-radius: 7px;
      border: 1px solid #ccc;
      font-weight: bold;
      cursor: pointer;
      background: white;
    }

    .delete-btn {
      border: none;
      background: #d93025;
      color: white;
      padding: 9px 14px;
      border-radius: 7px;
      cursor: pointer;
      font-weight: bold;
    }

    .delete-btn:hover {
      background: #b71c1c;
    }

    .empty {
      background: white;
      padding: 45px 20px;
      text-align: center;
      border-radius: 14px;
      color: #777;
      box-shadow: 0 3px 12px rgba(0,0,0,0.07);
    }

    .loading {
      background: white;
      padding: 35px;
      text-align: center;
      border-radius: 14px;
      color: #555;
    }

    .error {
      background: #fff0f0;
      border: 1px solid #ffcccc;
      color: #b00020;
      padding: 18px;
      border-radius: 10px;
      margin-bottom: 20px;
    }

    @media (max-width: 800px) {
      .summary {
        grid-template-columns: repeat(2, 1fr);
      }

      .customer-grid {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 550px) {
      header h1 {
        font-size: 24px;
      }

      .container {
        width: 94%;
      }

      .summary {
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }

      .summary-card {
        padding: 14px 8px;
      }

      .summary-card .number {
        font-size: 23px;
      }

      .items-table {
        font-size: 12px;
      }

      .items-table th,
      .items-table td {
        padding: 7px 5px;
      }

      .order-card {
        padding: 14px;
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>🌿 DHANA FOODS</h1>
    <p>Admin Order Dashboard</p>
  </header>


  <main class="container">

    <div class="top-bar">

      <h2>📦 Customer Orders</h2>

      <button
        type="button"
        class="refresh-btn"
        onclick="loadOrders()"
      >
        🔄 Refresh Orders
      </button>

    </div>


    <div class="summary">

      <div class="summary-card">
        <span
          class="number"
          id="totalOrders"
        >
          0
        </span>

        <span class="label">
          Total Orders
        </span>
      </div>


      <div class="summary-card">
        <span
          class="number"
          id="pendingOrders"
        >
          0
        </span>

        <span class="label">
          🟡 Pending
        </span>
      </div>


      <div class="summary-card">
        <span
          class="number"
          id="preparingOrders"
        >
          0
        </span>

        <span class="label">
          🔵 Preparing
        </span>
      </div>


      <div class="summary-card">
        <span
          class="number"
          id="deliveryOrders"
        >
          0
        </span>

        <span class="label">
          🟠 Out for Delivery
        </span>
      </div>

    </div>


    <div id="errorBox"></div>


    <div id="ordersContainer">

      <div class="loading">
        Loading orders...
      </div>

    </div>

  </main>


  <script>

    const VALID_STATUSES = [
      "Pending",
      "Preparing",
      "Out for Delivery",
      "Delivered"
    ];


    /* =====================================================
       ESCAPE HTML
       ===================================================== */

    function escapeHtml(value) {

      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }


    /* =====================================================
       PARSE ITEMS
       ===================================================== */

    function parseItems(items) {

      if (Array.isArray(items)) {
        return items;
      }

      if (typeof items === "string") {

        try {
          const parsed = JSON.parse(items);

          return Array.isArray(parsed)
            ? parsed
            : [];

        } catch (error) {

          console.error(
            "Unable to parse items:",
            error
          );

          return [];
        }
      }

      return [];
    }


    /* =====================================================
       GET ORDER TOTAL
       ===================================================== */

    function getOrderTotal(order) {

      if (
        order.total !== undefined &&
        order.total !== null
      ) {

        const total =
          Number(order.total);

        if (!Number.isNaN(total)) {
          return total;
        }
      }


      const items =
        parseItems(order.items);


      return items.reduce(
        (sum, item) => {

          const price =
            Number(
              item.price ||
              item.unitPrice ||
              0
            );

          const quantity =
            Number(
              item.quantity ||
              item.qty ||
              0
            );

          return sum + price * quantity;

        },
        0
      );
    }


    /* =====================================================
       FORMAT MONEY
       ===================================================== */

    function money(value) {

      return `₹${Number(value || 0).toFixed(0)}`;

    }


    /* =====================================================
       FORMAT DATE
       ===================================================== */

    function formatDate(value) {

      if (!value) {
        return "-";
      }


      const date =
        new Date(value);


      if (Number.isNaN(date.getTime())) {
        return String(value);
      }


      return date.toLocaleDateString(
        "en-IN",
        {
          day: "2-digit",
          month: "2-digit",
          year: "numeric"
        }
      );

    }


    /* =====================================================
       LOAD ORDERS
       ===================================================== */

    async function loadOrders() {

      const container =
        document.getElementById(
          "ordersContainer"
        );

      const errorBox =
        document.getElementById(
          "errorBox"
        );


      container.innerHTML = `
        <div class="loading">
          Loading orders...
        </div>
      `;

      errorBox.innerHTML = "";


      try {

        const response =
          await fetch(
            "/api/orders",
            {
              cache: "no-store"
            }
          );


        let result = null;


        try {

          result =
            await response.json();

        } catch (error) {

          result = null;

        }


        console.log(
          "Orders API response:",
          result
        );


        if (!response.ok) {

          throw new Error(
            result?.error ||
            result?.message ||
            "Unable to load orders."
          );

        }


        let orders = [];


        /*
          Support all expected response formats:
          1. [...]
          2. { orders: [...] }
          3. { data: [...] }
        */

        if (Array.isArray(result)) {

          orders = result;

        } else if (
          result &&
          Array.isArray(result.orders)
        ) {

          orders = result.orders;

        } else if (
          result &&
          Array.isArray(result.data)
        ) {

          orders = result.data;

        } else {

          throw new Error(
            "Invalid orders response."
          );

        }


        renderSummary(orders);

        renderOrders(orders);


      } catch (error) {

        console.error(
          "Admin order loading error:",
          error
        );


        container.innerHTML = "";


        errorBox.innerHTML = `
          <div class="error">
            <strong>Unable to load orders.</strong>
            <br>
            ${escapeHtml(error.message)}
          </div>
        `;

      }

    }


    /* =====================================================
       SUMMARY
       ===================================================== */

    function renderSummary(orders) {

      const pending =
        orders.filter(
          order =>
            String(order.status || "Pending") ===
            "Pending"
        ).length;


      const preparing =
        orders.filter(
          order =>
            String(order.status || "") ===
            "Preparing"
        ).length;


      const delivery =
        orders.filter(
          order =>
            String(order.status || "") ===
            "Out for Delivery"
        ).length;


      document.getElementById(
        "totalOrders"
      ).textContent = orders.length;


      document.getElementById(
        "pendingOrders"
      ).textContent = pending;


      document.getElementById(
        "preparingOrders"
      ).textContent = preparing;


      document.getElementById(
        "deliveryOrders"
      ).textContent = delivery;

    }


    /* =====================================================
       RENDER ORDERS
       ===================================================== */

    function renderOrders(orders) {

      const container =
        document.getElementById(
          "ordersContainer"
        );


      if (!orders.length) {

        container.innerHTML = `
          <div class="empty">
            <div style="font-size:42px;">
              📭
            </div>

            <h3 style="margin:10px 0;">
              No Orders Yet
            </h3>

            <p>
              New customer orders will appear here.
            </p>
          </div>
        `;

        return;
      }


      /*
         Newest orders first.
      */

      orders.sort(
        (a, b) =>
          Number(b.id || 0) -
          Number(a.id || 0)
      );


      container.innerHTML =
        orders.map(
          renderOrderCard
        ).join("");

    }


    /* =====================================================
       ORDER CARD
       ===================================================== */

    function renderOrderCard(order) {

      const id =
        order.id ?? "-";


      const customerName =
        order.customer_name ??
        order.customerName ??
        "-";


      const phone =
        order.phone ??
        "-";


      const address =
        order.address ??
        "-";


      const deliveryDate =
        order.delivery_date ??
        order.deliveryDate ??
        "";


      const status =
        VALID_STATUSES.includes(
          order.status
        )
          ? order.status
          : "Pending";


      const total =
        getOrderTotal(order);


      const items =
        parseItems(order.items);


      const createdAt =
        order.created_at ??
        order.createdAt ??
        "";


      const statusClass =
        status
          .toLowerCase()
          .replace(/\s+/g, "-");


      let itemsHtml = "";


      if (!items.length) {

        itemsHtml = `
          <tr>
            <td colspan="4">
              No item details available.
            </td>
          </tr>
        `;

      } else {

        itemsHtml =
          items.map(item => {

            const product =
              item.productName ??
              item.product_name ??
              item.name ??
              "-";


            const size =
              item.size ??
              "-";


            const quantity =
              Number(
                item.quantity ??
                item.qty ??
                0
              );


            const price =
              Number(
                item.price ??
                item.unitPrice ??
                0
              );


            const itemTotal =
              price * quantity;


            return `
              <tr>

                <td>
                  ${escapeHtml(product)}
                </td>

                <td>
                  ${escapeHtml(size)}
                </td>

                <td>
                  ${quantity}
                </td>

                <td>
                  ${money(itemTotal)}
                </td>

              </tr>
            `;

          }).join("");

      }


      return `
        <div
          class="order-card ${statusClass}"
          id="order-${escapeHtml(String(id))}"
        >

          <div class="order-header">

            <div>

              <div class="order-id">
                Order #${escapeHtml(String(id))}
              </div>

              <div class="order-date">
                ${createdAt
                  ? "Placed: " + escapeHtml(formatDate(createdAt))
                  : ""}
              </div>

            </div>

          </div>


          <div class="customer-section">

            <h3>
              👤 Customer Details
            </h3>

            <div class="customer-grid">

              <div class="customer-row">
                <strong>Name:</strong>
                ${escapeHtml(customerName)}
              </div>

              <div class="customer-row">
                <strong>Phone:</strong>
                ${escapeHtml(phone)}
              </div>

              <div
                class="customer-row"
                style="grid-column: 1 / -1;"
              >
                <strong>Address:</strong>
                ${escapeHtml(address)}
              </div>

            </div>

          </div>


          <div class="items-section">

            <h3>
              🛒 Ordered Items
            </h3>

            <table class="items-table">

              <thead>

                <tr>
                  <th>Product</th>
                  <th>Size</th>
                  <th>Qty</th>
                  <th>Amount</th>
                </tr>

              </thead>

              <tbody>
                ${itemsHtml}
              </tbody>

            </table>

          </div>


          <div class="order-bottom">

            <div>

              <div class="total">
                Total: ${money(total)}
              </div>

              <div class="delivery-date">
                📅 Delivery Date:
                <strong>
                  ${escapeHtml(
                    deliveryDate
                      ? formatDate(deliveryDate)
                      : "-"
                  )}
                </strong>
              </div>

            </div>


            <div class="actions">

              <select
                class="status-select"
                onchange="updateStatus(
                  ${Number(id)},
                  this.value
                )"
              >

                ${VALID_STATUSES.map(
                  currentStatus => `
                    <option
                      value="${escapeHtml(currentStatus)}"
                      ${currentStatus === status
                        ? "selected"
                        : ""}
                    >
                      ${currentStatus}
                    </option>
                  `
                ).join("")}

              </select>


              <button
                type="button"
                class="delete-btn"
                onclick="deleteOrder(${Number(id)})"
              >
                🗑️ Delete
              </button>

            </div>

          </div>

        </div>
      `;

    }


    /* =====================================================
       UPDATE STATUS
       ===================================================== */

    async function updateStatus(
      orderId,
      status
    ) {

      if (
        !VALID_STATUSES.includes(status)
      ) {

        alert(
          "Invalid order status."
        );

        return;

      }


      try {

        const response =
          await fetch(
            `/api/orders/${orderId}`,
            {
              method: "PUT",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body: JSON.stringify({
                status: status
              })
            }
          );


        let result = null;


        try {

          result =
            await response.json();

        } catch (error) {

          result = null;

        }


        if (!response.ok) {

          throw new Error(
            result?.error ||
            result?.message ||
            "Unable to update order status."
          );

        }


        if (
          result &&
          result.success === false
        ) {

          throw new Error(
            result.error ||
            result.message ||
            "Unable to update order status."
          );

        }


        /*
           Reload so the status and
           summary counters are always correct.
        */

        await loadOrders();


      } catch (error) {

        console.error(
          "Status update error:",
          error
        );


        alert(
          error.message ||
          "Unable to update order status."
        );


        await loadOrders();

      }

    }


    /* =====================================================
       DELETE ORDER
       ===================================================== */

    async function deleteOrder(
      orderId
    ) {

      const confirmed =
        confirm(
          `Delete Order #${orderId}?\n\nThis cannot be undone.`
        );


      if (!confirmed) {
        return;
      }


      try {

        const response =
          await fetch(
            `/api/orders/${orderId}`,
            {
              method: "DELETE"
            }
          );


        let result = null;


        try {

          result =
            await response.json();

        } catch (error) {

          result = null;

        }


        if (!response.ok) {

          throw new Error(
            result?.error ||
            result?.message ||
            "Unable to delete order."
          );

        }


        if (
          result &&
          result.success === false
        ) {

          throw new Error(
            result.error ||
            result.message ||
            "Unable to delete order."
          );

        }


        await loadOrders();


      } catch (error) {

        console.error(
          "Delete order error:",
          error
        );


        alert(
          error.message ||
          "Unable to delete order."
        );

      }

    }


    /* =====================================================
       START
       ===================================================== */

    document.addEventListener(
      "DOMContentLoaded",
      function() {

        loadOrders();

      }
    );

  </script>

</body>
</html>
