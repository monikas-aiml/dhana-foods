<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dhana Foods - Admin</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #fff8ef;
            color: #33261f;
        }

        header {
            background: linear-gradient(135deg, #7b2f0d, #b84f1c);
            color: white;
            text-align: center;
            padding: 28px 15px;
        }

        header h1 {
            margin: 0 0 8px;
            font-size: 32px;
        }

        header p {
            margin: 0;
            font-size: 16px;
        }

        .container {
            width: 94%;
            max-width: 1200px;
            margin: 30px auto;
        }

        .top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 25px;
        }

        .top h2 {
            margin: 0;
            color: #722e12;
        }

        .refresh {
            border: 0;
            background: #8b3513;
            color: white;
            padding: 12px 20px;
            border-radius: 9px;
            font-weight: bold;
            cursor: pointer;
        }

        .refresh:hover {
            background: #a9471a;
        }

        .summary {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 18px;
            margin-bottom: 25px;
        }

        .summary-box {
            background: white;
            border: 1px solid #ead7c1;
            border-radius: 16px;
            padding: 22px;
            text-align: center;
            box-shadow: 0 5px 18px rgba(80,40,10,.07);
        }

        .summary-icon {
            font-size: 30px;
        }

        .summary-number {
            font-size: 30px;
            font-weight: bold;
            color: #8b3513;
            margin-top: 5px;
        }

        .summary-title {
            color: #74665d;
            margin-top: 5px;
        }

        #loading {
            background: white;
            border-radius: 15px;
            padding: 30px;
            text-align: center;
            color: #8b3513;
            font-weight: bold;
        }

        #error {
            display: none;
            background: #ffe4e4;
            color: #a00000;
            border: 1px solid #e0aaaa;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 20px;
            text-align: center;
            font-weight: bold;
        }

        .order {
            background: white;
            border: 1px solid #ead7c1;
            border-radius: 18px;
            padding: 22px;
            margin-bottom: 22px;
            box-shadow: 0 6px 20px rgba(80,40,10,.08);
        }

        .order-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #eaded4;
            padding-bottom: 15px;
            gap: 15px;
        }

        .order-id {
            font-size: 23px;
            font-weight: bold;
            color: #713014;
        }

        .order-date {
            color: #777;
            font-size: 14px;
        }

        .customer {
            background: #fff8ed;
            border: 1px solid #f0dfc8;
            border-radius: 12px;
            padding: 17px;
            margin-top: 18px;
        }

        .customer div {
            margin: 8px 0;
            line-height: 1.5;
        }

        .customer strong {
            color: #513426;
        }

        .section-title {
            color: #713014;
            font-size: 20px;
            font-weight: bold;
            margin: 22px 0 10px;
        }

        .table-wrap {
            overflow-x: auto;
            border: 1px solid #eaded4;
            border-radius: 10px;
        }

        table {
            width: 100%;
            min-width: 650px;
            border-collapse: collapse;
        }

        th {
            background: #f7efe6;
            padding: 12px;
            text-align: left;
        }

        td {
            padding: 12px;
            border-top: 1px solid #eee1d6;
        }

        .product {
            font-weight: bold;
            color: #733315;
        }

        .qty {
            text-align: center;
            font-weight: bold;
        }

        .price {
            color: #9b431c;
            font-weight: bold;
        }

        .total {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 18px;
            padding-top: 15px;
            border-top: 2px solid #e6cdb2;
            font-size: 24px;
            font-weight: bold;
            color: #713014;
        }

        .total span {
            color: #a9481c;
        }

        .delivery {
            background: #f4f8ef;
            border: 1px solid #d9e4cf;
            border-radius: 10px;
            padding: 14px;
            margin-top: 17px;
            color: #315a35;
        }

        .status-row {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 18px;
        }

        .status-row label {
            font-weight: bold;
        }

        select {
            padding: 10px 13px;
            border: 1px solid #d6c0aa;
            border-radius: 8px;
            background: white;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
        }

        .badge {
            padding: 8px 14px;
            border-radius: 25px;
            font-weight: bold;
        }

        .pending {
            background: #fff0bd;
            color: #806000;
        }

        .preparing {
            background: #dcecff;
            color: #07558a;
        }

        .out {
            background: #ffe3c2;
            color: #9a4d00;
        }

        .delivered {
            background: #d9f5dd;
            color: #18702d;
        }

        .cancelled {
            background: #ffdede;
            color: #a00000;
        }

        .delete {
            margin-top: 18px;
            border: 0;
            background: #dc3333;
            color: white;
            padding: 11px 18px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }

        .delete:hover {
            background: #b92323;
        }

        .empty {
            background: white;
            border: 1px solid #ead7c1;
            border-radius: 16px;
            text-align: center;
            padding: 50px 20px;
        }

        .empty div {
            font-size: 50px;
        }

        .empty h2 {
            color: #713014;
        }

        .empty p {
            color: #777;
        }

        @media (max-width: 700px) {
            header h1 {
                font-size: 26px;
            }

            .top {
                flex-direction: column;
            }

            .refresh {
                width: 100%;
            }

            .summary {
                grid-template-columns: 1fr;
            }

            .order-top {
                flex-direction: column;
                align-items: flex-start;
            }

            .total {
                justify-content: space-between;
                font-size: 20px;
            }

            .status-row {
                flex-direction: column;
                align-items: stretch;
            }

            select,
            .delete {
                width: 100%;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>🥣 Dhana Foods Admin Dashboard</h1>
    <p>Customer Orders Management</p>
</header>

<div class="container">

    <div class="top">
        <h2>📋 Customer Orders</h2>

        <button
            class="refresh"
            type="button"
            onclick="loadOrders()"
        >
            🔄 Refresh Orders
        </button>
    </div>

    <div class="summary">

        <div class="summary-box">
            <div class="summary-icon">📦</div>
            <div
                class="summary-number"
                id="totalOrders"
            >
                0
            </div>
            <div class="summary-title">
                Total Orders
            </div>
        </div>

        <div class="summary-box">
            <div class="summary-icon">⏳</div>
            <div
                class="summary-number"
                id="pendingOrders"
            >
                0
            </div>
            <div class="summary-title">
                Pending Orders
            </div>
        </div>

        <div class="summary-box">
            <div class="summary-icon">💰</div>
            <div
                class="summary-number"
                id="totalSales"
            >
                ₹0
            </div>
            <div class="summary-title">
                Total Sales
            </div>
        </div>

    </div>

    <div id="error"></div>

    <div id="loading">
        ⏳ Loading orders...
    </div>

    <div id="orders"></div>

</div>


<script>

    /* =====================================================
       LOAD ALL ORDERS
    ===================================================== */

    async function loadOrders() {

        const loading =
            document.getElementById("loading");

        const ordersBox =
            document.getElementById("orders");

        const errorBox =
            document.getElementById("error");


        loading.style.display = "block";
        errorBox.style.display = "none";
        ordersBox.innerHTML = "";


        try {

            const response =
                await fetch("/api/orders", {
                    method: "GET",
                    headers: {
                        "Accept": "application/json"
                    },
                    cache: "no-store"
                });


            if (!response.ok) {

                throw new Error(
                    "Server error: " +
                    response.status
                );
            }


            const data =
                await response.json();


            console.log(
                "Dhana Foods API:",
                data
            );


            /*
                YOUR CURRENT SERVER RETURNS:

                [
                    order,
                    order,
                    order
                ]

                So use data directly.
            */

            if (!Array.isArray(data)) {

                throw new Error(
                    "Orders data is not an array."
                );
            }


            updateSummary(data);


            loading.style.display = "none";


            if (data.length === 0) {

                showEmpty();

                return;
            }


            data.forEach(function(order) {

                ordersBox.appendChild(
                    createOrder(order)
                );

            });


        } catch (err) {

            console.error(
                "Admin error:",
                err
            );


            loading.style.display = "none";


            errorBox.innerHTML =
                "❌ Unable to load orders.<br><br>" +
                escapeHTML(
                    err.message
                );


            errorBox.style.display = "block";
        }
    }


    /* =====================================================
       CREATE ORDER
    ===================================================== */

    function createOrder(order) {

        const box =
            document.createElement("div");

        box.className = "order";


        const id =
            Number(order.id) || 0;


        const customerName =
            order.customer_name ||
            "-";


        const phone =
            order.phone ||
            "-";


        const address =
            order.address ||
            "-";


        const deliveryDate =
            order.delivery_date ||
            "-";


        const status =
            order.status ||
            "Pending";


        const total =
            Number(order.total) || 0;


        const created =
            formatDate(
                order.created_at
            );


        const items =
            readItems(
                order.items
            );


        let rows = "";


        if (items.length === 0) {

            rows = `
                <tr>
                    <td colspan="5" style="text-align:center;">
                        No products found
                    </td>
                </tr>
            `;

        } else {

            items.forEach(function(item) {

                const product =
                    item.product ||
                    "-";


                const size =
                    item.size ||
                    "-";


                const quantity =
                    Number(
                        item.quantity
                    ) || 0;


                const price =
                    Number(
                        item.price
                    ) || 0;


                const itemTotal =
                    quantity * price;


                rows += `

                    <tr>

                        <td class="product">
                            ${escapeHTML(product)}
                        </td>

                        <td>
                            ${escapeHTML(size)}
                        </td>

                        <td class="qty">
                            ${quantity}
                        </td>

                        <td>
                            ₹${price}
                        </td>

                        <td class="price">
                            ₹${itemTotal}
                        </td>

                    </tr>

                `;
            });
        }


        box.innerHTML = `

            <div class="order-top">

                <div class="order-id">
                    🧾 Order #${id}
                </div>

                <div class="order-date">
                    ${created}
                </div>

            </div>


            <div class="customer">

                <div>
                    👤
                    <strong>Customer:</strong>
                    ${escapeHTML(customerName)}
                </div>

                <div>
                    📞
                    <strong>Phone:</strong>
                    ${escapeHTML(phone)}
                </div>

                <div>
                    📍
                    <strong>Address:</strong>
                    ${escapeHTML(address)}
                </div>

            </div>


            <div class="section-title">
                📦 Ordered Products
            </div>


            <div class="table-wrap">

                <table>

                    <thead>

                        <tr>
                            <th>Product</th>
                            <th>Size</th>
                            <th>Qty</th>
                            <th>Unit Price</th>
                            <th>Total</th>
                        </tr>

                    </thead>

                    <tbody>
                        ${rows}
                    </tbody>

                </table>

            </div>


            <div class="total">

                Order Total:

                <span>
                    ₹${total}
                </span>

            </div>


            <div class="delivery">

                📅
                <strong>Delivery Date:</strong>
                ${escapeHTML(deliveryDate)}

            </div>


            <div class="status-row">

                <label>
                    Order Status:
                </label>


                <select
                    onchange="
                        changeStatus(
                            ${id},
                            this.value
                        )
                    "
                >

                    <option
                        value="Pending"
                        ${status === "Pending"
                            ? "selected"
                            : ""}
                    >
                        🟡 Pending
                    </option>

                    <option
                        value="Preparing"
                        ${status === "Preparing"
                            ? "selected"
                            : ""}
                    >
                        🔵 Preparing
                    </option>

                    <option
                        value="Out for Delivery"
                        ${status === "Out for Delivery"
                            ? "selected"
                            : ""}
                    >
                        🟠 Out for Delivery
                    </option>

                    <option
                        value="Delivered"
                        ${status === "Delivered"
                            ? "selected"
                            : ""}
                    >
                        🟢 Delivered
                    </option>

                    <option
                        value="Cancelled"
                        ${status === "Cancelled"
                            ? "selected"
                            : ""}
                    >
                        🔴 Cancelled
                    </option>

                </select>


                <span
                    class="badge ${statusClass(status)}"
                >
                    ${statusEmoji(status)}
                    ${escapeHTML(status)}
                </span>

            </div>


            <button
                class="delete"
                type="button"
                onclick="
                    deleteOrder(${id})
                "
            >
                🗑️ Delete Order
            </button>

        `;


        return box;
    }


    /* =====================================================
       READ ORDER ITEMS
    ===================================================== */

    function readItems(items) {

        if (Array.isArray(items)) {

            return items;
        }


        if (typeof items === "string") {

            try {

                const parsed =
                    JSON.parse(items);


                if (
                    Array.isArray(parsed)
                ) {

                    return parsed;
                }

            } catch (error) {

                console.error(
                    "Items parse error:",
                    error
                );
            }
        }


        return [];
    }


    /* =====================================================
       SUMMARY
    ===================================================== */

    function updateSummary(orders) {

        let pending = 0;
        let sales = 0;


        orders.forEach(function(order) {

            if (
                (order.status || "Pending")
                === "Pending"
            ) {
                pending++;
            }


            sales +=
                Number(order.total) || 0;

        });


        document.getElementById(
            "totalOrders"
        ).textContent =
            orders.length;


        document.getElementById(
            "pendingOrders"
        ).textContent =
            pending;


        document.getElementById(
            "totalSales"
        ).textContent =
            "₹" + sales;
    }


    /* =====================================================
       CHANGE STATUS
    ===================================================== */

    async function changeStatus(
        orderId,
        status
    ) {

        try {

            const response =
                await fetch(
                    "/api/orders/" + orderId,
                    {
                        method: "PUT",

                        headers: {
                            "Content-Type":
                                "application/json",
                            "Accept":
                                "application/json"
                        },

                        body:
                            JSON.stringify({
                                status: status
                            })
                    }
                );


            const data =
                await response.json();


            if (!response.ok) {

                throw new Error(
                    data.message ||
                    "Status update failed."
                );
            }


            await loadOrders();


        } catch (error) {

            console.error(
                "Status error:",
                error
            );


            alert(
                error.message
            );


            await loadOrders();
        }
    }


    /* =====================================================
       DELETE ORDER
    ===================================================== */

    async function deleteOrder(
        orderId
    ) {

        const yes =
            confirm(
                "Delete Order #" +
                orderId +
                "?"
            );


        if (!yes) {
            return;
        }


        try {

            const response =
                await fetch(
                    "/api/orders/" + orderId,
                    {
                        method: "DELETE",
                        headers: {
                            "Accept":
                                "application/json"
                        }
                    }
                );


            const data =
                await response.json();


            if (!response.ok) {

                throw new Error(
                    data.message ||
                    "Delete failed."
                );
            }


            await loadOrders();


        } catch (error) {

            console.error(
                "Delete error:",
                error
            );


            alert(
                error.message
            );
        }
    }


    /* =====================================================
       STATUS CLASS
    ===================================================== */

    function statusClass(status) {

        if (
            status === "Preparing"
        ) {
            return "preparing";
        }


        if (
            status === "Out for Delivery"
        ) {
            return "out";
        }


        if (
            status === "Delivered"
        ) {
            return "delivered";
        }


        if (
            status === "Cancelled"
        ) {
            return "cancelled";
        }


        return "pending";
    }


    /* =====================================================
       STATUS EMOJI
    ===================================================== */

    function statusEmoji(status) {

        if (
            status === "Preparing"
        ) {
            return "🔵";
        }


        if (
            status === "Out for Delivery"
        ) {
            return "🟠";
        }


        if (
            status === "Delivered"
        ) {
            return "🟢";
        }


        if (
            status === "Cancelled"
        ) {
            return "🔴";
        }


        return "🟡";
    }


    /* =====================================================
       DATE
    ===================================================== */

    function formatDate(value) {

        if (!value) {
            return "-";
        }


        const date =
            new Date(value);


        if (
            Number.isNaN(
                date.getTime()
            )
        ) {
            return escapeHTML(
                String(value)
            );
        }


        return date.toLocaleString(
            "en-IN",
            {
                day: "2-digit",
                month: "short",
                year: "numeric",
                hour: "2-digit",
                minute: "2-digit"
            }
        );
    }


    /* =====================================================
       EMPTY ORDERS
    ===================================================== */

    function showEmpty() {

        document.getElementById(
            "orders"
        ).innerHTML = `

            <div class="empty">

                <div>📦</div>

                <h2>
                    No Orders Yet
                </h2>

                <p>
                    Customer orders will appear here.
                </p>

            </div>

        `;
    }


    /* =====================================================
       ESCAPE HTML
    ===================================================== */

    function escapeHTML(value) {

        return String(value)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }


    /* =====================================================
       START
    ===================================================== */

    loadOrders();

</script>

</body>
</html>
